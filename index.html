<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    
    <!-- TAG PER FORZARE LO SCHERMO INTERO (PWA) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">

    <title>Magic Canvas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- MODALITÀ 1: Disegno Libero -->
    <div id="mode-canvas" class="mode active">
        <canvas id="paintCanvas"></canvas>
        <div class="color-palette">
            <button class="color-btn" data-color="#e74c3c" style="background: #e74c3c;"></button>
            <button class="color-btn" data-color="#3498db" style="background: #3498db;"></button>
            <button class="color-btn" data-color="#f1c40f" style="background: #f1c40f;"></button>
            <button class="color-btn" data-color="#2ecc71" style="background: #2ecc71;"></button>
        </div>
    </div>

    <!-- MODALITÀ 2: Carte / Figure -->
    <div id="mode-cards" class="mode">
        <div class="card-grid">
            <div class="card-item" data-index="0">⭐</div>
            <div class="card-item" data-index="1">🎈</div>
            <div class="card-item" data-index="2">🚀</div>
            <div class="card-item" data-index="3">👑</div>
        </div>
    </div>

    <!-- Forziamo il refresh della PWA incrementando la versione dello script -->
    <script src="app.js?v=3.0"></script>
</body>
</html>
